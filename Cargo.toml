[workspace]
members = ["neocase", "neocase-core"]
resolver = "2"


[workspace.dependencies]
# Internal
neocase-core = { path = "./neocase-core/" }
# External
anyhow = "1.0.96"
convert_case = "0.8.0"
nvim-oxi = { version = "0.6.0", features = ["neovim-0-12"] }
rustc-hash = "2.1.1"

[workspace.lints.clippy]
pedantic = {priority = -1, level = "warn"}
module_name_repetitions = "allow"
missing_errors_doc = "allow"
similar_names = "allow"


[patch.crates-io]
nvim-oxi = { git = "https://github.com/noib3/nvim-oxi", rev = "d411003cbe660cd32014806b2d1a04651b7d06e0" }
